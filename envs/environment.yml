# =============================================================================
# MethylBench - Main Conda Environment
# =============================================================================
# Usage:
#   conda env create -f environment.yml
#   conda activate methylbench
#
# NOTE: Some tools have known dependency conflicts and should be installed
# in separate environments (see envs/ directory):
#   - modkit         → envs/ont.yaml
#   - pb-cpg-tools   → envs/pacbio.yaml
#   - toulligqc      → envs/ont.yaml
#
# PREPROCESSING (WGEC, RRBS, TWIST alignment + methylation calling):
#   Handled externally by nf-core/methylseq v1.0.0 (Nextflow pipeline)
#   https://nf-co.re/methylseq/1.0.0
#   Run separately: nextflow run nf-core/methylseq -r 1.0.0 -profile conda
# =============================================================================

name: methylbench

channels:
  - conda-forge      
  - bioconda         
  - nanoporetech     
  - defaults

