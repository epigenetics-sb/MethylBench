# =============================================================================
# MethylBench - R Analysis Environment
# =============================================================================
# Install standalone: conda env create -f envs/r_analysis.yaml -n methylbench-r

name: methylbench-r

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - r-base=4.3
  - r-tidyverse>=2.0
  - r-dplyr>=1.1
  - r-ggplot2>=3.4
  - r-data.table>=1.15
  - r-ggridges>=0.5
  - r-ggrepel>=0.9
  - r-patchwork>=1.2
  - r-pheatmap>=1.0
  - r-rcolorbrewer>=1.1
  - r-viridis>=0.6
  - r-cowplot>=1.1
  - r-scales>=1.3
  - bioconductor-limma>=3.58
  - r-complexupset>=1.3
  - r-upsetr>=1.4
  - bioconductor-rnbeads>=2.12
  - bioconductor-rnbeads.hg38
  - bioconductor-annotatr>=1.26
  - bioconductor-genomicranges>=1.54
  - bioconductor-iranges>=2.36
  - bioconductor-txdb.hsapiens.ucsc.hg38.knowngene
  - bioconductor-bsgenome.hsapiens.ucsc.hg38
  - bioconductor-org.hs.eg.db>=3.18
  - bioconductor-complexheatmap>=2.18
  - bioconductor-watermelon>=2.6
  - bioconductor-minfi>=1.48
  - r-optparse>=1.7
  - r-here>=1.0
  - r-knitr>=1.45
  - r-rmarkdown>=2.25
