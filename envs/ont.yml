# =============================================================================
# MethylBench - ONT Environment
# =============================================================================
# Install standalone: conda env create -f envs/ont.yaml -n methylbench-ont

name: methylbench-ont

channels:
  - nanoporetech      
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.11
  - modkit>=0.6.1          
  - minimap2>=2.26         
  - samtools>=1.19
  - toulligqc>=2.8        
  - pod5>=0.3
  - pysam>=0.22
  - numpy>=1.26
  - pandas>=2.1
  - tqdm>=4.66
  - h5py>=3.10
